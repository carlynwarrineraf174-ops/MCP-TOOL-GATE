[project]
name = "mcp-tool-gate"
version = "0.1.0"
description = "MCP 工具的契约变更门禁：schema 快照 + 语义 diff + 严重度分级 + CI 卡点"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-gate = "gate.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
