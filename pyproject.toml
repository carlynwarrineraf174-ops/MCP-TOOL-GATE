[project]
name = "mcp-tool-gate"
version = "0.1.0"
description = "AI 工具契约质量门禁：schema 快照 + 语义 diff + 严重度分级 + CI 卡点"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "python-dotenv",
    "pydantic"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
govern = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7",
    "pydantic-settings>=2"
]

[project.scripts]
mcp-gate = "gate.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate", "govern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]